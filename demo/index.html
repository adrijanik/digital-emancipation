.pin.off{background:transparent;color:var(--muted);border:1px solid var(--line)}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}

.res .bad{color:var(--bad);font-weight:600}
.mono{font-family:var(--mono);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:13.5px}

 var host=hostOf(),minor=Math.round(pay(C.buyers.A).e*100),out='';
 out+=blk('Payout',[['Open Payments','e'],['Settlement (proposed)','p']],code('# one writer\u2019s share of the cohort payment\nPOST https://pay.'+host+'.example/incoming-payments\n{\n  "walletAddress": "https://wallet.'+host+'.example/anna",\n  "incomingAmount": { "value": "'+minor+'", "assetCode": "EUR", "assetScale": 2 },\n  "metadata": { "agreement": "urn:agreement:lumen-1", "cohort": '+C.buyers.A.cohort+' }\n}'),'Open Payments moves the money. The escrow that released it is the proposed part.');
 var res=s.audit==='breach'?'<urn:anna:doc/msg-0099>':s.audit==='ok'?'# (no rows)':'# not run yet';
 out+=blk('The audit, as a query',[['SPARQL','e'],['RDF','e']],code('PREFIX ex: <urn:ex:>\n\n# documents the lab says it trained on, minus documents Anna licensed\nSELECT ?doc\nWHERE {\n  GRAPH <urn:lab:lumen:manifest-month6> { ?doc a ex:Document }\n  FILTER NOT EXISTS {\n    GRAPH <urn:anna:graph:manifest> { ?doc a ex:Document }\n  }\n}\n\n# result\n'+res),'A set difference over two published graphs. The lab\u2019s manifest is a signed RDF graph it promised to publish. A non-empty result is a breach, and the consequence clause in the agreement applies.');
 out+=blk('Canary records',[['RDF','e']],code('# planted in the delivered copy, absent from every public source\n<urn:anna:doc/post-0002> ex:canary "ember-lattice-4417" .\n\n# later: probe the model for the phrase'),'If a model reproduces a canary, the licensed delivery is a likely source. This is evidence, not proof. Nobody can yet prove from outside that a model trained on a given record, or remove one person\u2019s influence from it.');
 return out;
}
function render(){
 renderScn();renderSteps();
 $('#stage').innerHTML=[scene0,scene1,C.kind==='ai'?scene2ai:scene2,C.kind==='ai'?scene3ai:scene3][s.step]();
 $('#ledger').innerHTML=ledger();
 $('#tech').innerHTML=view==='tech'?renderTech():'';
}
var T=function(fn,ms){return new Promise(function(r){setTimeout(function(){fn();r()},ms)})};
document.addEventListener('click',function(ev){
 var sc=ev.target.closest('[data-scn]');
 var vw=ev.target.closest('[data-view]');
 if(vw){view=vw.getAttribute('data-view');render();return}
 if(sc){cur=sc.getAttribute('data-scn');C=SC[cur];prep();ensureH();mins=9*60+14;s=fresh();render();return}
 var g=ev.target.closest('[data-go]');
 if(g&&!g.disabled){s.step=+g.getAttribute('data-go');render();return}
 var a=ev.target.closest('[data-act]');if(!a||a.disabled)return;
 var act=a.getAttribute('data-act');
 if(act==='next'){if(canNext()){s.step++;s.max=Math.max(s.max,s.step);render()}}
 else if(act==='back'){s.step--;render()}
 else if(act==='reset'){mins=9*60+14;s=fresh();render()}
 else if(act==='open'){s.opened=true;s.pins[1]=true;add('Account opened at Bank A. Credentials issued: adult, resident.');render()}
 else if(act==='import'){
  var mine=s;s.importing=1;render();
  sha(C.orig).then(function(h){
   s.hash=h;
   return T(function(){if(s!==mine)return;s.importing=2;add('Portability request filed to '+C.holderShort+' for Anna (GDPR Art. 20).');render()},500)
    .then(function(){return T(function(){if(s!==mine)return;s.importing=3;add('Export received.');render()},600)})
    .then(function(){return T(function(){if(s!==mine)return;s.importing=4;add('Converted to linked data with provenance. Titles registered to Anna.','T');render()},600)})
    .then(function(){return T(function(){if(s!==mine)return;s.imported=true;s.pins[3]=true;add('Receipt for '+C.rcpName+' stored: '+h.slice(0,12)+'…. Record encrypted with Anna’s key; the bank keeps a recovery share only.');s.max=Math.max(s.max,1);render()},600)});
  });
 }
 else if(act==='agent'){
  var b=C.buyers[s.buyer];
  if(b.refuse){s.verdict='refuse';add(b.name+' offered '+money(b.price)+' per record. '+C.agentRefuseLog,'N')}
  else{s.verdict='accept';add(b.name+' offered '+money(b.price)+' per record. Agent accepted: all four policies satisfied.','N')}
  render();
 }
 else if(act==='query'){
  var expected=s.hash,mine2=s,q=pay(C.buyers.A);
  sha(s.tamper?C.alt:C.orig).then(function(actual){
   if(s!==mine2)return;
   s.verify={expected:expected.slice(0,12)+'…',actual:actual.slice(0,12)+'…'};
   add('Buyer funded escrow: '+m0(q.g)+'.','S');
   if(actual!==expected){s.delivered='failed';add('Verification failed for '+C.rcpName+'. Record withheld, holder notified.','S')}
   else{s.delivered='ok';s.max=Math.max(s.max,2);add(C.delivLog,'S')}
   render();
  });
 }
 else if(act==='knock'){s.knocked=true;add(C.buyers[s.buyer].bot+' requested /anna/writing/. The pod answered 401 with a ticket. Nothing was served.','N');render()}
 else if(act==='round'){var rs=C.neg[s.buyer],r=rs[s.round];s.round++;add(r.final?r.from+': '+r.note:r.from+' proposed €'+r.price.toFixed(2)+' per writer, '+r.scope.toLowerCase()+'.','N');if(r.final==='agree'){s.agreed=true;add('Agreement signed by both sides (ODRL, Data Integrity proofs).','T')}if(r.final==='nodeal'){s.noDeal=true}render()}
 else if(act==='escrow'){s.escrow=true;add('Lumen Labs funded escrow: €50,000.00 (50,000 writers at €1.00).','S');render()}
 else if(act==='fetch'){s.fetched=true;s.delivered='ok';s.max=Math.max(s.max,2);add('Crawler presented its token. Licensed corpus delivered with a signed manifest. Private messages: refused (403).','S');render()}
 else if(act==='rogue'){s.rogue++;add('ShadowBot skipped negotiation and requested /anna/writing/. Refused (401) and logged.');render()}
 else if(act==='audit'){s.audit=s.tamper?'breach':'ok';add(s.tamper?'Audit: the lab’s manifest lists msg-0099, never licensed. Licence withdrawn, remedy clause applies.':'Audit passed: every document in the lab’s manifest was licensed.','N');render()}
 else if(act==='pay'){var q2=pay(C.buyers.A);s.paid=true;s.balance=q2.e;s.pins[4]=true;add('Escrow released. Anna credited '+money(q2.e)+' (cohort '+m0(q2.g)+', fee 2%).','S');render()}
 else if(act==='switch'){s.carrier=s.carrier==='Bank A'?'Bank B':'Bank A';s.switched=true;s.pins[2]=true;add('Carrier switched to '+s.carrier+'. Titles, receipts and balance unchanged.');render()}
});
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.matches('[data-mode]')){s.modes[t.getAttribute('data-mode')]=t.value;render();return}
 if(t.name==='buyer'){s.buyer=t.value;s.verdict=null;s.delivered=null;s.round=0;s.agreed=false;s.noDeal=false;s.escrow=false;render();return}
 if(t.id==='tamper'){s.tamper=t.checked;s.audit=null;if(s.delivered==='failed')s.delivered=null;render()}
});
prep();ensureH();render();
})();
</script>
